[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-mcp-server"
version = "0.1.0"
description = "An MCP server providing networking tools: diagnostics, monitoring, and device management"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "dnspython>=2.4.0",
    "paramiko>=3.3.0",
]

[project.scripts]
network-mcp = "network_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
